name: Performance Benchmarks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: "0 0 * * 0"

jobs:
  benchmark:
    name: Run Performance Benchmarks - Marshmallow ${{ matrix.marshmallow-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        marshmallow-version: ["3", "4"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies (Marshmallow ${{ matrix.marshmallow-version }})
        run: |
          if [ "${{ matrix.marshmallow-version }}" = "3" ]; then
            uv sync --group dev --group marshmallow3
          else
            uv sync --group dev --group marshmallow4
          fi
          # Install package in editable mode to register entry points
          uv pip install -e .

      - name: Run serialization benchmarks
        run: |
          uv run python performance/serialization_speed.py > benchmark_results_m${{ matrix.marshmallow-version }}.txt
          cat benchmark_results_m${{ matrix.marshmallow-version }}.txt

      - name: Check performance regression
        run: |
          # Extract average serialization speedup from the summary line
          SPEEDUP_LINE=$(grep "Average Serialization Speedup:" benchmark_results_m${{ matrix.marshmallow-version }}.txt)
          if [ -z "$SPEEDUP_LINE" ]; then
            echo "❌ Could not find speedup summary in benchmark results"
            cat benchmark_results_m${{ matrix.marshmallow-version }}.txt
            exit 1
          fi

          # Extract the numeric speedup value (e.g., "2.06x" -> "2.06")
          SPEEDUP=$(echo "$SPEEDUP_LINE" | sed -E 's/.*: ([0-9.]+)x.*/\1/')
          echo "Detected average serialization speedup: ${SPEEDUP}x"
          echo "Full line: $SPEEDUP_LINE"

          # Fail if speedup is less than 2.0x (indicating regression)
          if (( $(echo "$SPEEDUP < 2.0" | bc -l) )); then
            echo "❌ Performance regression detected! Average speedup ${SPEEDUP}x is below 2.0x threshold"
            exit 1
          else
            echo "✅ Performance check passed: ${SPEEDUP}x average speedup"
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-marshmallow-${{ matrix.marshmallow-version }}
          path: benchmark_results_m${{ matrix.marshmallow-version }}.txt
          retention-days: 30

  profiling:
    name: Run Profiling Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --group dev --group marshmallow3
          # Install package in editable mode to register entry points
          uv pip install -e .

      - name: Run profiling benchmark
        run: |
          uv run python profiling/profile_hotspots.py benchmark > profiling_results.txt
          cat profiling_results.txt

      - name: Upload profiling results
        uses: actions/upload-artifact@v4
        with:
          name: profiling-results
          path: profiling_results.txt
          retention-days: 30
