name: Documentation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  generate-code-examples:
    name: Generate Code Examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev --group marshmallow3

      - name: Generate JIT code examples
        run: |
          uv run python docs/generated_code/dump_jit.py

      - name: Check if generated code is up-to-date
        run: |
          if git diff --exit-code docs/generated_code/*.py; then
            echo "✅ Generated code is up-to-date"
          else
            echo "❌ Generated code needs to be updated"
            echo "Please run: python docs/generated_code/dump_jit.py"
            exit 1
          fi

      - name: Upload generated examples
        uses: actions/upload-artifact@v4
        with:
          name: generated-code-examples
          path: docs/generated_code/

  check-docs:
    name: Check Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check markdown files
        run: |
          # Check for broken links in markdown
          find docs -name "*.md" -type f | while read file; do
            echo "Checking $file"
            # Add markdown linting here if needed
          done

      - name: Verify required documentation
        run: |
          required_docs=(
            "README.md"
            "docs/architecture.md"
            "docs/inliners.md"
          )

          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "❌ Missing required documentation: $doc"
              exit 1
            fi
          done

          echo "✅ All required documentation files present"
