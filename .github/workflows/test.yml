name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} with Marshmallow ${{ matrix.marshmallow-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        marshmallow-version: ["3", "4"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies (Marshmallow ${{ matrix.marshmallow-version }})
        run: |
          if [ "${{ matrix.marshmallow-version }}" = "3" ]; then
            uv sync --group dev --group marshmallow3
          else
            uv sync --group dev --group marshmallow4
          fi
          # Install package in editable mode to register entry points
          uv pip install -e .

      - name: Run linting with ruff
        run: |
          uv run ruff check marshmallow_jit tests

      - name: Run formatting check with ruff
        run: |
          uv run ruff format --check marshmallow_jit tests

      - name: Run type checking with ty
        run: |
          uv run ty check marshmallow_jit tests

      - name: Run tests with pytest
        run: |
          uv run pytest --cov=marshmallow_jit --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.14' && matrix.marshmallow-version == '3'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Check coverage threshold
        run: |
          uv run coverage report --fail-under=90

  test-matrix-summary:
    name: Test Matrix Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi
